name: Build customer app iOS (unsigned, verification only)

# There's no way to sign/distribute an iOS build without a real Apple
# Developer account and a Mac (Xcode's signing tooling doesn't run on
# Linux) - that part has to happen on someone's actual Mac. What this
# workflow *can* do on a GitHub-hosted macOS runner is compile the whole
# Flutter + Xcode + CocoaPods pipeline unsigned (--no-codesign) and catch
# real build breakage (a bad Podfile, a plugin with no iOS support, an
# Xcode project misconfiguration, ...) before anyone wastes time on a Mac
# finding out the hard way. Uses the same secrets as
# build-customer-apk.yml (SUPABASE_URL/SUPABASE_ANON_KEY/MAPTILER_API_KEY)
# - no Google Maps key needed here since this never actually renders a
# map, just compiles.
on:
  push:
    branches:
      - main
      - claude/project-nature-3gwftj
    paths:
      - "ios/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-customer-ios.yml"
  workflow_dispatch:

jobs:
  build-ios-unsigned:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Write app.env
        # Not ".env" - same filename used by every other build target now
        # (see build-customer-apk.yml's own comment for why: Android's
        # aapt packaging silently drops dotfiles from the built APK).
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> app.env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> app.env
          echo "MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}" >> app.env

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned - compiles only, produces no installable IPA)
        run: flutter build ios --release --no-codesign

name: Deploy admin dashboard to Vercel

# Builds the real AL HODHOD admin dashboard (lib/main.dart's default
# kIsWeb branch - see AdminApp) and deploys the static output to Vercel,
# separately from the customer app's own GitHub Pages preview
# (deploy-customer-web.yml). Vercel has no native Flutter build support, so
# the Flutter SDK build happens here on GitHub's runners; only the already-
# built static build/web/ folder is handed to the Vercel CLI.
#
# Requires repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL / SUPABASE_ANON_KEY - same ones deploy-customer-web.yml uses
#   VERCEL_TOKEN       - Vercel account -> Settings -> Tokens
#   VERCEL_ORG_ID      - from .vercel/project.json after a one-time local
#   VERCEL_PROJECT_ID  - `npx vercel link` (see that file's own doc comment)
on:
  push:
    branches:
      - main
      - claude/project-nature-3gwftj
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Write .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (admin dashboard)
        run: flutter build web --release

      - name: Deploy to Vercel
        working-directory: build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --yes

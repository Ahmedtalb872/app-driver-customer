name: Deploy admin dashboard to Vercel

# Builds the real AL HODHOD admin dashboard (lib/main.dart's default
# kIsWeb branch - see AdminApp) and deploys the static output to Vercel,
# separately from the customer app's own GitHub Pages preview
# (deploy-customer-web.yml). Vercel has no native Flutter build support, so
# the Flutter SDK build happens here on GitHub's runners; only the already-
# built static build/web/ folder is handed to the Vercel CLI.
#
# Requires repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL / SUPABASE_ANON_KEY - same ones deploy-customer-web.yml uses
#   VERCEL_TOKEN - Vercel account -> Settings -> Tokens
#
# Deliberately does NOT rely on VERCEL_ORG_ID/VERCEL_PROJECT_ID secrets: on a
# Hobby (personal, single-scope) account those are easy to copy from the
# wrong settings page and the CLI then fails with "Project not found" with
# no further detail. `vercel link --yes --project=...` resolves the org/
# project pair itself from the token's own account, non-interactively, so
# it can't get out of sync with reality the way a hand-copied ID can.
on:
  push:
    branches:
      - main
      - claude/project-nature-3gwftj
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Write .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (admin dashboard)
        run: flutter build web --release

      # Copy the finished static site outside the git checkout before handing
      # it to the Vercel CLI. Run from inside build/web (still under the repo's
      # .git), the CLI auto-attaches commit metadata to the deployment, and
      # Vercel then blocks it with "Git author <bot email> must have access to
      # the team" - the CI token's own account is a team member, but that
      # extra author-identity check isn't satisfied by a bot commit author,
      # and the CLI just hangs polling a deployment that will never go ready.
      # A directory with no .git ancestor has nothing for the CLI to attach,
      # so the deploy is treated as a plain token-authenticated CLI deploy.
      # Also ships a "no build" vercel.json so Vercel serves it as-is instead
      # of running a leftover Build/Install Command from the project's
      # dashboard settings against a directory with no package.json.
      - name: Prepare deploy directory
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          cp -r build/web/. "$RUNNER_TEMP/deploy/"
          cat > "$RUNNER_TEMP/deploy/vercel.json" <<'EOF'
          {
            "buildCommand": null,
            "installCommand": null,
            "framework": null
          }
          EOF

      - name: Link Vercel project
        working-directory: ${{ runner.temp }}/deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel link --yes --project=hudhud-admin-vercel --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        working-directory: ${{ runner.temp }}/deploy
        timeout-minutes: 3
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --yes --debug
